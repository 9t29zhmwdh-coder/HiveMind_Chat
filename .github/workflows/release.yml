name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build the binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin hivemind-server --bin hive
      - name: Generate SBOMs
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          (cd frontend && npm sbom --sbom-format cyclonedx > ../frontend-sbom.cdx.json)
      - name: Package
        run: |
          staging="hivemind-chat-${{ matrix.target }}"
          mkdir -p "$staging/web"
          cp target/${{ matrix.target }}/release/hivemind-server "$staging/"
          cp target/${{ matrix.target }}/release/hive "$staging/"
          cp -R frontend/dist/* "$staging/web/"
          cp README.md LICENSE hivemind.example.toml "$staging/"
          mkdir -p "$staging/sbom"
          find . -name "*.cdx.json" -not -path "./target/*" -not -path "*/node_modules/*" -exec cp {} "$staging/sbom/" \;
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hivemind-chat-${{ matrix.target }}
          path: |
            hivemind-chat-${{ matrix.target }}.tar.gz
            hivemind-chat-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checkout runs first: its git clean would otherwise remove the
      # downloaded artifacts, which are untracked files in the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz
      - name: Extract the changelog section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no changelog section for $version" >&2
            exit 1
          fi
          cat release-notes.md
      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: true
