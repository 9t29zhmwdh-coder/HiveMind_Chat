[workspace]
resolver = "2"
members = ["crates/hive-core", "crates/hive-server", "crates/hive-cli"]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/9t29zhmwdh-coder/HiveMind_Chat"

[workspace.dependencies]
hive-core = { path = "crates/hive-core", version = "1.0.1" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
